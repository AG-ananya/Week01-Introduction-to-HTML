<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 50px 50px;
            grid-template-rows: 50px 50px;
            border: 3px solid black;
        }
        .item{

border: 1px solid black;
        }
        #item1{
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            background-color: rgb(143, 204, 248);
        }
        #item2{
            grid-column: 2 / 2;
            grid-row: 1 / 2;
            background-color: rgb(160, 249, 188);
        }
        #item3{
            grid-column: 1 / 2;
            grid-row: 2 / 2;
            background-color: rgb(241, 161, 228);
        }
        #item4{
            grid-column: 2 /2 ;
            grid-row: 2 / 2;
            background-color: rgb(240, 209, 153);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="item1" class="item">item1</div>
        <div id="item2" class="item">item2</div>
        <div id="item3" class="item">item3</div>
        <div id="item4" class="item">item4</div>
    </div>
</body>
</html>
