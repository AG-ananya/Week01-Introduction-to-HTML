<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="netflixx.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Netflix</div>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">New & Popular</a>
      <a href="#">My List</a>
    </nav>
    <div class="user-options">
      <input type="text" placeholder="Search">
      <span>Profile</span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Unlimited movies, TV shows, and more.</h1>
      <p>Watch anywhere. Cancel anytime.</p>
      <button class="cta">Get Started</button>
    </div>
  </section>

  <section class="movie-grid">
    <h2>Popular on Netflix</h2>
    <div class="movies">
      <div class="movie-card"><img src="image/movie1.jpg" alt="movie1"></div>
      <div class="movie-card"><img src="image\movie3.jpg" alt="movie2"></div>
      <div class="movie-card"><img src="image\movie4.jpg" alt="movie3"></div>
      <div class="movie-card"><img src="image\movie55.jpg" alt="movie4"></div>
      <div class="movie-card"><img src="image\moive6jpg.jpg" alt="movie5"></div>
    </div>
  </section>

  <footer>
    <p>Netflix Clone</p>
  </footer>
</body>
</html>
