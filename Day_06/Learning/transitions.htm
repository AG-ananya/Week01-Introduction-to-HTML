<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
             height: 25px;
            width: 150px;
            background-color: palevioletred;
            border: 2px solid black;
            border-radius: 10px;
            /*transition-property: all;
            transition-duration: 4s;
            transition-timing-function:steps(3);
            transition-delay: 1s;*/
            transition: all 4s steps(3) 1s ;
            margin: 20px;
            padding: 20px;
        }
        button:hover{
            height: 30px;
            width: 200px;
            background-color: rgb(198, 80, 147);
        }
        button:active{
            height: 30px;
            width: 200px;
            background-color: rgb(228, 3, 86);
        }
        .box{
            height: 50px;
            width: 50px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: plum;
            align-items: center;
            top: 50px;
            left: 50px;
            transition: all 2s ease-in;
            margin: 20px;
         padding: 5px;   
        }
        #box1:hover{
                       /* transform: scale(2); */
           transform: translate(50px);
        }
        #box2:hover{
           /* transform:rotate(360deg); */
            transform: scalex(2);
        }  
        #box3:hover{
            transform: rotate(360deg); 
        }
        #box4:hover{
transform: skew(45deg);
        }
    </style>
</head>
<body>
    <button>Learning</button>
    <div id="box1" class="box">translate</div>
    <div id="box2" class="box">scale</div>
    <div id="box3" class="box">rotate</div>
    <div id="box4" class="box">skew</div>
</body>
</html>
